stages:
  - verify
  - container-test
  - build
  - release

include:
  - component: $CI_SERVER_FQDN/components/docker/build@2.0.0
    inputs:
      job-name: build-edge
      tags: edge
      platforms: linux/amd64,linux/arm64
      build-args: --build-arg GIT_TAG=edge-$CI_COMMIT_SHORT_SHA --build-arg GIT_HASH=$CI_COMMIT_SHA
  - component: $CI_SERVER_FQDN/components/docker/build@2.0.0
    inputs:
      job-name: build-release
      tags: $CI_COMMIT_TAG ${CI_COMMIT_TAG%.*} ${CI_COMMIT_TAG%%.*} latest
      platforms: linux/amd64,linux/arm64
      build-args: --build-arg GIT_TAG=$CI_COMMIT_TAG --build-arg GIT_HASH=$CI_COMMIT_SHA
  - component: $CI_SERVER_FQDN/components/release/release@1.0.0
    inputs:
      changelog: CHANGELOG.md

# The live component catalog is protected by an interactive challenge and its
# published inventory contains no Go verifier, so verification remains local.
verify-go:
  stage: verify
  image: golang:1.27-bookworm
  variables:
    CGO_ENABLED: "0"
  script:
    - go mod download
    - go mod tidy -diff
    - go mod verify
    - go list -deps ./... >/dev/null
    - test -z "$(gofmt -l cmd internal)"
    - go vet ./...
    - go test ./...
    - go build ./...
    - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.1 run
    - go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
    - go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
    - CGO_ENABLED=1 go test -race ./...
    - GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -o /tmp/warrden-linux-amd64 ./cmd/warrden
    - GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -o /tmp/warrden-linux-arm64 ./cmd/warrden

# No catalog component provides project-specific scratch-image behavior tests.
verify-container:
  stage: container-test
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - cp .env.example .env
    - cp config.example.yaml config.yaml
    - docker compose config --quiet
    - docker build --platform linux/arm64 -t warrden:container-test-arm64 .
    - docker build --platform linux/amd64 --build-arg GIT_TAG=container-test --build-arg GIT_HASH=$CI_COMMIT_SHA -t warrden:container-test .
    - docker volume create warrden-container-test-data
    - docker run --rm --entrypoint /app/bin/clear-missing -e PUID=1000 -e PGID=1000 -e CONFIG_PATH=/config/config.yaml -e DATABASE_PATH=/app/data/warden.db -v warrden-container-test-data:/app/data -v "$CI_PROJECT_DIR/config.example.yaml:/config/config.yaml:ro" warrden:container-test
    - docker run --rm --entrypoint /app/bin/clear-upgrades -e PUID=1000 -e PGID=1000 -e CONFIG_PATH=/config/config.yaml -e DATABASE_PATH=/app/data/warden.db -v warrden-container-test-data:/app/data -v "$CI_PROJECT_DIR/config.example.yaml:/config/config.yaml:ro" warrden:container-test
    - docker create --name warrden-container-test-files warrden:container-test
    - docker cp warrden-container-test-files:/etc/ssl/certs/ca-certificates.crt /tmp/ca-certificates.crt
    - test -s /tmp/ca-certificates.crt
    - docker rm warrden-container-test-files
    - docker run -d --name warrden-container-test-daemon -e PUID=1000 -e PGID=1000 -e TZ=America/Los_Angeles -e CONFIG_PATH=/config/config.yaml -e DATABASE_PATH=/app/data/warden.db -v warrden-container-test-data:/app/data -v "$CI_PROJECT_DIR/config.example.yaml:/config/config.yaml:ro" warrden:container-test
    - for attempt in $(seq 1 30); do docker logs warrden-container-test-daemon 2>&1 | grep -q "wArrden initialized" && break; sleep 1; done
    - docker logs warrden-container-test-daemon 2>&1 | grep -q "Timezone.*America/Los_Angeles"
    - docker stop --time 10 warrden-container-test-daemon
    - test "$(docker inspect --format '{{.State.ExitCode}}' warrden-container-test-daemon)" = "0"
  after_script:
    - docker rm -f warrden-container-test-daemon warrden-container-test-files 2>/dev/null || true
    - docker volume rm warrden-container-test-data 2>/dev/null || true

# The docker build template ships no rules (it would otherwise run on every pipeline)
# and the release template runs on any tag; scope each generated job by overriding it.
build-edge:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

build-release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'

release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'

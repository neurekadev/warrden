services:
  warrden:
    image: registry.neureka.dev/warrden/warrden:4
    container_name: warrden
    env_file:
      - .env
    networks:
      - warrden
    volumes:
      - data:/app/data
      - ./config.yaml:/app/data/config.yaml
    restart: unless-stopped

networks:
  warrden:
    name: warrden

volumes:
  data:

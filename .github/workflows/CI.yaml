name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CGO_ENABLED: 0

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check Formatting
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.go')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files are not formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Run Golangci-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CGO_ENABLED: 0

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run Unit Tests
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CGO_ENABLED: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            goos: linux
            arch: amd64
            output: warrden-linux-amd64
          - name: Linux ARM64
            goos: linux
            arch: arm64
            output: warrden-linux-arm64

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Go Packages
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: go build ./...

      - name: Build Release Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          OUTPUT: ${{ runner.temp }}/${{ matrix.output }}
        run: go build -trimpath -buildvcs=false -o "$OUTPUT" ./cmd/warrden

      - name: Upload Release Binary
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries-${{ matrix.goos }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 1

  build-images:
    name: Build Image ${{ matrix.name }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - lint
      - unit-tests
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Image AMD64
            component: warrden
            description: Automated media library maintenance with wArrden
            context: .
            dockerfile: Dockerfile
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - name: Image ARM64
            component: warrden
            description: Automated media library maintenance with wArrden
            context: .
            dockerfile: Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      CACHE_PREFIX: ${{ (github.ref_type == 'tag' || github.ref == 'refs/heads/main') && 'publish' || 'ci' }}
      IMAGE: ghcr.io/${{ github.repository }}
      PUBLISH_IMAGE: ${{ github.ref_type == 'tag' || github.ref == 'refs/heads/main' }}
      SOURCE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || (github.ref == 'refs/heads/main' && 'edge' || 'dev') }}

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log In to GHCR
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Image Metadata
        id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=wArrden
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.SOURCE_VERSION }}
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=wArrden
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.SOURCE_VERSION }}

      - name: Build Platform Image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: ${{ env.PUBLISH_IMAGE == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          provenance: ${{ env.PUBLISH_IMAGE == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUBLISH_IMAGE == 'true' }}
          build-args: |
            GIT_TAG=${{ env.SOURCE_VERSION }}
            GIT_HASH=${{ github.sha }}
          cache-from: |
            type=gha,scope=${{ env.CACHE_PREFIX }}-${{ matrix.component }}-${{ matrix.arch }}
            ${{ env.CACHE_PREFIX == 'ci' && format('type=gha,scope=publish-{0}-{1}', matrix.component, matrix.arch) || '' }}
          cache-to: type=gha,scope=${{ env.CACHE_PREFIX }}-${{ matrix.component }}-${{ matrix.arch }},mode=max,ignore-error=true

      - name: Export Image Digest
        if: env.PUBLISH_IMAGE == 'true'
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Build produced an invalid digest: $DIGEST" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload Image Digest
        if: env.PUBLISH_IMAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.component }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Image
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    needs:
      - lint
      - unit-tests
      - build
      - build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      SOURCE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}

    steps:
      - name: Download Image Digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-warrden-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log In to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Image Metadata
        id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=edge
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=wArrden
            org.opencontainers.image.description=Automated media library maintenance with wArrden
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.SOURCE_VERSION }}
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=wArrden
            org.opencontainers.image.description=Automated media library maintenance with wArrden
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.SOURCE_VERSION }}

      - name: Create Multi-Platform Manifest
        shell: bash
        env:
          DIGESTS: ${{ runner.temp }}/digests
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find "$DIGESTS" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${#digest_files[@]}" -ne 2 ]]; then
            echo "Expected two platform digests, found ${#digest_files[@]}." >&2
            exit 1
          fi

          sources=()
          for digest in "${digest_files[@]}"; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid digest filename: $digest" >&2
              exit 1
            fi
            sources+=("$IMAGE@sha256:$digest")
          done

          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          if [[ "${#tag_args[@]}" -eq 0 ]]; then
            echo "No image tags were generated for $SOURCE_VERSION." >&2
            exit 1
          fi

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Verify Multi-Platform Manifest
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "$VERSION" ]]; then
            echo "Image metadata did not produce a version." >&2
            exit 1
          fi
          manifest="$(docker buildx imagetools inspect --raw "$IMAGE:$VERSION")"
          for platform in linux/amd64 linux/arm64; do
            os="${platform%/*}"
            architecture="${platform#*/}"
            jq -e --arg os "$os" --arg architecture "$architecture" \
              'any(.manifests[]?; .platform.os == $os and .platform.architecture == $architecture)' \
              <<< "$manifest" >/dev/null
          done

  release:
    name: Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - lint
      - unit-tests
      - build
      - build-images
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check Out Repository History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Release Binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-binaries-*
          path: release-assets
          merge-multiple: true

      - name: Create Release
        uses: neurekadev/create-release-action@2
        with:
          github-token: ${{ github.token }}
          api-key: ${{ secrets.INFERENCE_API_KEY }}
          base-url: https://api.openai.com/v1
          model: gpt-5.6-luna
          reasoning-effort: xhigh
          files: release-assets/**
